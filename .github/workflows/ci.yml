name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    name: Regras do repositório
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Verificar regras e histórico
        run: node scripts/check-rules.mjs
      - name: Testar verificações de regras
        run: node --test scripts/check-rules.test.mjs scripts/check-http-continuity.test.mjs
      - name: Testar diagnóstico do simulador
        run: python3 -m unittest discover -s scripts -p test_simulator_soak.py

  web:
    name: Web e formatação
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web
      - run: npm ci --prefix apps/web/tools/api-contract
      - name: Conferir tipos gerados do contrato
        run: node scripts/generate-api-types.mjs --check
      - name: Verificar formatação dos arquivos versionados
        run: node scripts/format.mjs
      - run: npm run lint --prefix apps/web
      - run: npm run typecheck --prefix apps/web
      - run: npm run build --prefix apps/web

  api:
    name: API e integração PostGIS
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          # SemVer da Adoptium para o JDK 25.0.4.1+1.
          java-version: '25.0.4+101.0.LTS'
          cache: maven
      - name: Construir o banco usado nos testes
        run: docker build --tag bora-postgis:18.6-3.6.4 infra/postgres
      - name: Verificar formatação, compilar e testar
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - run: npm ci --prefix apps/web/tools/api-contract
      - name: Conferir contrato exportado contra os tipos da web
        run: node scripts/generate-api-types.mjs --schema=apps/api/target/openapi.json --check

  postgres:
    name: PostGIS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Construir imagem na arquitetura nativa
        run: docker buildx build --load --tag bora-postgis:test infra/postgres
      - name: Verificar banco, extensão e consulta espacial
        shell: bash
        run: |
          set -euo pipefail
          container="bora-postgis-${{ github.run_id }}-${{ strategy.job-index }}"
          trap 'docker rm --force "$container" >/dev/null 2>&1 || true' EXIT
          docker run --detach --name "$container" \
            --env POSTGRES_DB=bora \
            --env POSTGRES_USER=bora \
            --env POSTGRES_PASSWORD=bora_test \
            bora-postgis:test
          ready=false
          for _ in $(seq 1 60); do
            if docker exec --env PGPASSWORD=bora_test "$container" \
              psql --host=127.0.0.1 --username=bora --dbname=bora --no-password \
              --tuples-only --no-align --command="SELECT postgis_lib_version()"; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            docker logs "$container"
            exit 1
          fi
          result=$(docker exec --env PGPASSWORD=bora_test "$container" \
            psql --host=127.0.0.1 --username=bora --dbname=bora --no-password \
            --set=ON_ERROR_STOP=1 --tuples-only --no-align \
            --command="SELECT current_setting('server_version_num')::int = 180006 \
              AND postgis_lib_version() = '3.6.4' \
              AND ST_DWithin(ST_SetSRID(ST_MakePoint(-46.64, -23.55), 4326)::geography, \
                ST_SetSRID(ST_MakePoint(-46.6401, -23.5501), 4326)::geography, 100)")
          test "$result" = t

  deploy-tests:
    name: Atualização gradual e recuperação
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Construir a API para o teste
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          tags: bora-dev-api:latest
          cache-from: type=gha,scope=bora-api-amd64
          cache-to: type=gha,mode=max,scope=bora-api-amd64
      - name: Construir os arquivos da web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/web/Dockerfile.prod
          load: true
          tags: bora-web:m01-assets
          cache-from: type=gha,scope=bora-web-amd64
          cache-to: type=gha,mode=max,scope=bora-web-amd64
      - name: Construir o simulador para o teste
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/simulator/Dockerfile
          load: true
          tags: bora-simulator:dev
          cache-from: type=gha,scope=bora-simulator-amd64
          cache-to: type=gha,mode=max,scope=bora-simulator-amd64
      - name: Construir o banco para o teste
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: infra/postgres
          file: infra/postgres/Dockerfile
          load: true
          tags: bora-postgis:18.6-3.6.4
          cache-from: type=gha,scope=bora-postgis-amd64
          cache-to: type=gha,mode=max,scope=bora-postgis-amd64
      - name: Testar publicação, falha e recuperação com HTTP contínuo
        run: bash infra/deploy/test.sh
