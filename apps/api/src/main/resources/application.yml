spring:
  application:
    name: bora-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bora}
    username: ${SPRING_DATASOURCE_USERNAME:bora}
    password: ${SPRING_DATASOURCE_PASSWORD:bora_dev}
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 5
  flyway:
    clean-disabled: true
    validate-on-migrate: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        type:
          json_format_mapper: jackson3
  threads:
    virtual:
      enabled: true
  session:
    timeout: 2h
    jdbc:
      initialize-schema: never

server:
  port: 8080
  shutdown: graceful
  servlet:
    session:
      cookie:
        name: BORA_SESSION
        http-only: true
        same-site: lax
        secure: ${BORA_SESSION_SECURE:false}

springdoc:
  api-docs:
    path: /api/openapi
  paths-to-match: /api/v1/**

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-components: always
      show-details: never
      group:
        readiness:
          include: readinessState,db,routing
        liveness:
          include: livenessState

bora:
  orders:
    confirmation-secret: ${BORA_CONFIRMATION_SECRET:bora-local-development-only-confirmation-key}
  routing:
    graph-root: ${BORA_GRAPH_ROOT:target/routing-graphs}
    manifest: routing/data/manifest.json
    simulation-speed: ${SIM_SPEED:3}
    max-snap-distance-meters: 150
