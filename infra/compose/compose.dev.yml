name: bora-dev

services:
  db:
    image: bora-postgis:18.6-3.6.4
    build:
      context: ../postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bora}
      POSTGRES_USER: ${POSTGRES_USER:-bora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bora_dev}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD="$$POSTGRES_PASSWORD" psql --host=127.0.0.1 --username="$$POSTGRES_USER"
          --dbname="$$POSTGRES_DB" --no-password --tuples-only
          --command="SELECT current_setting('server_version'), postgis_version()"
          >/dev/null
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-bora}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-bora}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-bora_dev}
    ports:
      - '127.0.0.1:${API_PORT:-8080}:8080'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://localhost:8080/actuator/health/readiness
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  web:
    build:
      context: ../../apps/web
    environment:
      API_PROXY_TARGET: http://api:8080
    ports:
      - '127.0.0.1:${WEB_PORT:-5173}:5173'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:5173').then(response => {
          if (!response.ok) process.exit(1);
          }).catch(() => process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres-data:
